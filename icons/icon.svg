<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Calendar icon -->
  <rect x="24" y="32" width="80" height="72" rx="8" fill="white" opacity="0.95"/>
  <rect x="24" y="32" width="80" height="16" rx="8" fill="#ea4335"/>

  <!-- Calendar grid -->
  <line x1="42" y1="56" x2="42" y2="96" stroke="#666" stroke-width="1.5" opacity="0.3"/>
  <line x1="60" y1="56" x2="60" y2="96" stroke="#666" stroke-width="1.5" opacity="0.3"/>
  <line x1="78" y1="56" x2="78" y2="96" stroke="#666" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="64" x2="96" y2="64" stroke="#666" stroke-width="1.5" opacity="0.3"/>
  <line x1="32" y1="78" x2="96" y2="78" stroke="#666" stroke-width="1.5" opacity="0.3"/>

  <!-- Magnifying glass -->
  <circle cx="90" cy="90" r="18" fill="#4285f4" stroke="white" stroke-width="3"/>
  <circle cx="90" cy="90" r="10" fill="none" stroke="white" stroke-width="3"/>
  <line x1="99" y1="99" x2="110" y2="110" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
